<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MMM-LibraryMonitor preview</title>
  <desc id="desc">Illustration of the MMM-LibraryMonitor MagicMirror module with library account cards and due dates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0e1b2a" />
      <stop offset="100%" stop-color="#22405f" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="28" />
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#08111c" opacity="0.86" />
  <text x="120" y="150" fill="#f4f7fb" font-family="Verdana, sans-serif" font-size="42" font-weight="700">MMM-LibraryMonitor</text>
  <text x="120" y="192" fill="#9cb2c8" font-family="Verdana, sans-serif" font-size="24">Library accounts, borrowed media, and due dates at a glance</text>
  <rect x="120" y="245" width="430" height="240" rx="22" fill="#10253b" stroke="#375a7f" />
  <rect x="650" y="245" width="430" height="240" rx="22" fill="#10253b" stroke="#375a7f" />
  <text x="155" y="295" fill="#f4f7fb" font-family="Verdana, sans-serif" font-size="28" font-weight="700">Alex</text>
